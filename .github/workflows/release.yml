name: Release

# Builds a Developer ID-signed, notarized macOS DMG and the Windows/Linux portable zip,
# then publishes them to a GitHub release when a version tag (v1.2.3) is pushed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE           base64 of your "Developer ID Application" .p12 export
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_TEAM_ID               10-character team ID
#   APPLE_APP_PASSWORD          app-specific password from appleid.apple.com

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Signed & notarized DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (macOS 26+ SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check signing secrets
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "::error::Signing secrets are missing. An unsigned DMG is blocked by Gatekeeper on other Macs, so nothing is published. See the header of .github/workflows/release.yml."
            exit 1
          fi

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)
          if [ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packaging/Info.plist version $APP_VERSION"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials loggdin-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$RUNNER_TEMP/signing.keychain-db"

      - name: Build, sign, notarize and staple
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: loggdin-notary
          NOTARY_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: ./packaging/create_dmg.sh

      - name: Verify Gatekeeper accepts the release
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)
          spctl -a -vvv -t exec dist/Loggdin.app
          spctl -a -vvv -t open --context context:primary-signature "dist/loggdin-v${VERSION}.dmg"
          xcrun stapler validate "dist/loggdin-v${VERSION}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/loggdin-v*.dmg
            dist/loggdin-v*.dmg.sha256
          if-no-files-found: error

  portable:
    name: Portable zip (Windows & Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: ./packaging/create_portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portable-release
          path: dist/loggdin-portable-*.zip*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [ macos, portable ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "loggdin $GITHUB_REF_NAME" --generate-notes
          echo "### Update the Homebrew casks" >> "$GITHUB_STEP_SUMMARY"
          echo 'Set `sha256` in Casks/*.rb and packaging/loggdin.rb to:' >> "$GITHUB_STEP_SUMMARY"
          cat release/loggdin-v*.dmg.sha256 >> "$GITHUB_STEP_SUMMARY"
