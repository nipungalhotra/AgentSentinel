name: CI & Production Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Package on macOS
    # Needs the macOS 26+ SDK (Liquid Glass APIs, SwiftUI main-actor isolation).
    # The app itself still deploys to macOS 14 via #available guards.
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode (macOS 26+ SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          SDK=$(xcrun --show-sdk-version)
          echo "macOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $SDK is too old; Loggdin needs the macOS 26+ SDK"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Release Binary
        run: |
          swift build -c release

      - name: Run Comprehensive Test Suites
        run: |
          chmod +x tests/*.sh
          ./tests/run_all.sh

      - name: Build Release DMG Package
        run: |
          chmod +x packaging/create_dmg.sh
          ./packaging/create_dmg.sh

      - name: Verify DMG Output Artifact
        run: |
          ls -la dist/
          test -f dist/Loggdin.dmg
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)
          test -f "dist/loggdin-v${VERSION}.dmg"
          lipo -archs dist/Loggdin.app/Contents/MacOS/loggdin | grep -q x86_64
          lipo -archs dist/Loggdin.app/Contents/MacOS/loggdin | grep -q arm64
          codesign --verify --strict --verbose=2 dist/Loggdin.app

      - name: Upload Release Artifact (DMG)
        uses: actions/upload-artifact@v4
        with:
          name: Loggdin-macOS-universal
          path: dist/Loggdin.dmg
          retention-days: 14
          if-no-files-found: error

